name: Format

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  format:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Lint with Ruff
      run: make lint
    - name: Test
      run: make test
